        var capaINaturalist = L.layerGroup();

        function agregarObservacion(obs) {
            if (!obs.geojson) return;
            var lat = obs.geojson.coordinates[1];
            var lng = obs.geojson.coordinates[0];
            var foto = (obs.photos && obs.photos.length > 0) ? obs.photos[0].url.replace('square', 'medium') : null;
            var especie = obs.taxon ? (obs.taxon.preferred_common_name || obs.taxon.name) : 'Sin identificar';
            var nombreCientifico = obs.taxon ? obs.taxon.name : '';
            var observador = obs.user ? (obs.user.name || obs.user.login) : 'Anónimo';
            var fecha = obs.observed_on_string || obs.observed_on || 'Sin fecha';
            var notas = obs.description ? obs.description : '';
            var popupHtml = '<div style="max-width:220px;">' +
                (foto ? '<img src="' + foto + '" style="width:100%; border-radius:4px; margin-bottom:6px;">' : '') +
                '<b>' + especie + '</b>' +
                (nombreCientifico && nombreCientifico !== especie ? '<br><i>' + nombreCientifico + '</i>' : '') +
                '<br>Observador: ' + observador +
                '<br>Fecha: ' + fecha +
                (notas ? '<br><span style="font-size:11px;">' + notas + '</span>' : '') +
                '<br><a href="' + obs.uri + '" target="_blank">Ver observación completa</a>' +
                '</div>';
            L.circleMarker([lat, lng], { pane: 'pane_capaINaturalist', radius: 6, color: '#333', weight: 1, fillColor: '#ff9f1c', fillOpacity: 0.9 }).bindPopup(popupHtml).addTo(capaINaturalist);
        }

        function cargarObservacionesINaturalist() {
            var proyecto = 'registro-de-vegetacion-en-un-poligono-de-reforestacion-en-san-felipe-los-alzati-zitacuaro-mexico';
            capaINaturalist.clearLayers();
            function traerPagina(pagina) {
                var url = 'https://api.inaturalist.org/v1/observations?project_id=' + proyecto + '&per_page=200&page=' + pagina + '&order_by=observed_on&order=desc';
                fetch(url)
                    .then(function(res) { return res.json(); })
                    .then(function(data) {
                        data.results.forEach(agregarObservacion);
                        var totalCargado = pagina * 200;
                        if (totalCargado < data.total_results) {
                            traerPagina(pagina + 1);
                        } else {
                            console.log('iNaturalist: ' + data.total_results + ' observaciones totales cargadas.');
                        }
                    })
                    .catch(function(err) { console.log('No se pudieron cargar las observaciones de iNaturalist:', err); });
            }
            traerPagina(1);
        }

        map.createPane('pane_capaINaturalist');

		document.addEventListener("DOMContentLoaded", function() {
            function newLayersListHeight() {
                var layerScrollbarElement = document.querySelector('.leaflet-control-layers-scrollbar');
                if (layerScrollbarElement) {
                    var layersListElement = document.querySelector('.leaflet-control-layers-list');
                    var originalHeight = layersListElement.style.height || window.getComputedStyle(layersListElement).height;
                    var newHeight = parseFloat(originalHeight) - 50;
                    layersListElement.style.height = newHeight + 'px';
                }
            }
            var isLayersListExpanded = true;
            var controlLayersElement = document.querySelector('.leaflet-control-layers');
            var toggleLayerControl = document.querySelector('.leaflet-control-layers-toggle');
            toggleLayerControl.addEventListener('click', function() {
                if (isLayersListExpanded) {
                    controlLayersElement.classList.remove('leaflet-control-layers-expanded');
                } else {
                    controlLayersElement.classList.add('leaflet-control-layers-expanded');
                }
                isLayersListExpanded = !isLayersListExpanded;
                newLayersListHeight()
            });
			if (controlLayersElement) {
				controlLayersElement.addEventListener('click', function(event) {
					var toggleLayerHeaderPointer = event.target.closest('.leaflet-layerstree-header-pointer span');
					if (toggleLayerHeaderPointer) { newLayersListHeight(); }
				});
			}
            setTimeout(function() { toggleLayerControl.click(); }, 10);
            setTimeout(function() { toggleLayerControl.click(); }, 10);
            var isSmallScreen = window.innerWidth < 650;
